name: SmartERP CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests
        run: ./mvnw --batch-mode test
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        env:
          DB_PASSWORD: Strong_CI_SQL_Password_2026!
          JWT_SECRET: CI-only-secret-with-more-than-thirty-two-characters
          FRONTEND_URL: https://erp.example.com
          CORS_ALLOWED_ORIGINS: https://erp.example.com
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: CI-only-admin-password
          JPA_DDL_AUTO: update
          API_URL: https://api.example.com
          BACKEND_IMAGE: ghcr.io/example/smarterp/backend:ci
          FRONTEND_IMAGE: ghcr.io/example/smarterp/frontend:ci
        run: docker compose -f docker-compose.production.yaml config --quiet

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate translations
        run: npm run check:i18n
      - name: Build production application
        run: npm run build
