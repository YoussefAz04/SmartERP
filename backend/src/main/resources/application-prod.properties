# Production profile: schema changes must be managed explicitly.
spring.jpa.hibernate.ddl-auto=validate

# Cookies carrying authentication data must only travel over HTTPS.
cookie.secure=true

# Avoid exposing implementation details and API exploration endpoints publicly.
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
