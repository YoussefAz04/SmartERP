# SQL Server configuration. Environment variables override the local demo defaults.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BusinessManager;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# JDBC batching reduces round-trips on multi-row insert/update flows (e.g. saving a Commande with many lines).
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Email configuration. Leave credentials empty when email is not required locally.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
server.port=${SERVER_PORT:8020}
server.servlet.context-path=/


server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# JWT configuration. Always set JWT_SECRET in staging and production.
security.jwt.secret=${JWT_SECRET:SmartERP-local-development-only-secret-key-change-in-production-2026}
security.jwt.expiration=28800000
jwt.expiration-time=28800000
jwt.issuer=SymatiqueBusinessManager

cookie.secure=${COOKIE_SECURE:false}

spring.jpa.hibernate.dialect.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl



spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.indent-output=false
spring.jackson.date-format=yyyy-MM-dd


spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss
spring.mvc.format.time=HH:mm:ss
# AI forecast pipeline (see ForecastService / MlForecastEngine)
forecast.outlier.policy=winsorize
forecast.boxcox.enabled=true
forecast.calendar.country=TN
forecast.cache.fingerprint-ttl-hours=24
forecast.ab.enabled=true
