<div class="signin-page">
  <!-- Decorative background blobs -->
  <div class="bg-blob bg-blob--1"></div>
  <div class="bg-blob bg-blob--2"></div>
  <div class="bg-blob bg-blob--3"></div>

  <div class="signin-card">

    <!-- Card top accent bar -->
    <div class="card-accent-bar"></div>

    <!-- Header -->
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="18" width="5" height="10" rx="2" fill="rgba(255,255,255,0.55)"/>
            <rect x="13.5" y="12" width="5" height="16" rx="2" fill="rgba(255,255,255,0.78)"/>
            <rect x="23" y="5" width="5" height="23" rx="2" fill="white"/>
          </svg>
        </div>
        <span class="brand-name"><span class="brand-smart">Smart</span><span class="brand-erp">ERP</span></span>
      </div>

      <h1 class="card-title">Bienvenue !</h1>
      <p class="card-subtitle">Connectez-vous pour accéder à votre espace</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="navigation()" class="signin-form">

      <!-- Username -->
      <div class="field-group">
        <label class="field-label" for="username">Nom d'utilisateur</label>
        <div class="input-wrap" [class.is-error]="f['username'].invalid && f['username'].touched">
          <i class="fas fa-user input-icon"></i>
          <input
            type="text"
            id="username"
            formControlName="username"
            class="field-input"
            placeholder="Entrez votre identifiant"
            autocomplete="username">
        </div>
        <span class="field-error-msg" *ngIf="f['username'].invalid && f['username'].touched">
          <i class="fas fa-circle-exclamation"></i> Nom d'utilisateur requis
        </span>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="password">Mot de passe</label>
        <div class="input-wrap" [class.is-error]="f['password'].invalid && f['password'].touched">
          <i class="fas fa-lock input-icon"></i>
          <input
            [type]="password[0] ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="field-input"
            placeholder="••••••••"
            autocomplete="current-password">
          <button
            type="button"
            class="toggle-pw"
            [attr.aria-label]="password[0] ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            (click)="togglePassword(0)">
            <i class="fas" [class.fa-eye]="!password[0]" [class.fa-eye-slash]="password[0]"></i>
          </button>
        </div>
        <span class="field-error-msg" *ngIf="f['password'].invalid && f['password'].touched">
          <i class="fas fa-circle-exclamation"></i> Mot de passe requis
        </span>
      </div>

      <!-- Error alert -->
      <div *ngIf="errorMessage" class="alert-error" role="alert">
        <i class="fas fa-triangle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Options row -->
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-native" [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}">
          <span class="checkbox-box"></span>
          <span class="checkbox-text">Se souvenir de moi</span>
        </label>
        <a class="link-forgot" [routerLink]="routes.forgotPassword">Mot de passe oublié ?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" [disabled]="loading"
              [attr.aria-label]="loading ? 'Connexion en cours' : 'Se connecter'">
        <span *ngIf="loading" class="btn-spinner" role="status" aria-hidden="true"></span>
        <span class="btn-label">{{ loading ? 'Connexion en cours...' : 'Se connecter' }}</span>
        <i *ngIf="!loading" class="fas fa-arrow-right btn-arrow"></i>
      </button>

    </form>

    <!-- Footer -->
    <p class="card-footer-note">
      <i class="fas fa-shield-halved"></i> Connexion sécurisée · SmartERP &copy; 2025
    </p>

  </div>
</div>
