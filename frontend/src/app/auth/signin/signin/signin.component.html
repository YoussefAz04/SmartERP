<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="card-header">
      <div class="brand-logo">
        <svg width="40" height="40" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginLogoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect width="36" height="36" rx="10" fill="url(#loginLogoGrad)"/>
          <rect x="7" y="22" width="5" height="8" rx="2" fill="rgba(255,255,255,0.42)"/>
          <rect x="15.5" y="16" width="5" height="14" rx="2" fill="rgba(255,255,255,0.70)"/>
          <rect x="24" y="8" width="5" height="22" rx="2" fill="white"/>
        </svg>
        <span class="brand-text"><span class="brand-smart">Smart</span><span class="brand-erp">ERP</span></span>
      </div>
      <h2>Bon retour !</h2>
      <p>Connectez-vous pour accéder à votre espace de gestion</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="navigation()" class="modern-form">

      <!-- Nom d'utilisateur -->
      <div class="field-group">
        <label class="field-label" for="username">Nom d'utilisateur</label>
        <div class="input-wrapper" [class.input-error]="f['username'].invalid && f['username'].touched">
          <i class="fas fa-user field-icon"></i>
          <input
            type="text"
            id="username"
            formControlName="username"
            class="modern-input"
            placeholder="Entrez votre nom d'utilisateur"
            autocomplete="username">
        </div>
        <span class="field-error" *ngIf="f['username'].invalid && f['username'].touched">
          <i class="fas fa-info-circle"></i> Nom d'utilisateur requis
        </span>
      </div>

      <!-- Mot de passe -->
      <div class="field-group">
        <label class="field-label" for="password">Mot de passe</label>
        <div class="input-wrapper" [class.input-error]="f['password'].invalid && f['password'].touched">
          <i class="fas fa-lock field-icon"></i>
          <input
            [type]="password[0] ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="modern-input"
            placeholder="Entrez votre mot de passe"
            autocomplete="current-password">
          <span class="toggle-password fas"
                [class.fa-eye]="!password[0]"
                [class.fa-eye-slash]="password[0]"
                role="button"
                tabindex="0"
                [attr.aria-label]="password[0] ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                (click)="togglePassword(0)"
                (keydown.enter)="togglePassword(0)"
                (keydown.space)="togglePassword(0)">
          </span>
        </div>
        <span class="field-error" *ngIf="f['password'].invalid && f['password'].touched">
          <i class="fas fa-info-circle"></i> Mot de passe requis
        </span>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="error-banner">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Se souvenir / Mot de passe oublié -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" class="checkbox-input" [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}">
          Se souvenir de moi
        </label>
        <a class="forgot-link" [routerLink]="routes.forgotPassword">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton de connexion -->
      <button type="button" class="btn-signin" (click)="navigation()" [disabled]="loading"
              [attr.aria-label]="loading ? 'Connexion en cours' : 'Se connecter'">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
        <span>{{ loading ? 'Connexion en cours...' : 'Connexion' }}</span>
        <i *ngIf="!loading" class="fas fa-arrow-right btn-arrow"></i>
      </button>

    </form>
  </div>
</div>
