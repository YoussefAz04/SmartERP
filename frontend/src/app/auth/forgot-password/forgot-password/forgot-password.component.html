<div class="auth-page-wrapper">
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="auth-card">
    <!-- Header -->
    <div class="card-header">
      <div class="brand-logo">
        <svg width="40" height="40" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fpLogoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect width="36" height="36" rx="10" fill="url(#fpLogoGrad)"/>
          <rect x="7" y="22" width="5" height="8" rx="2" fill="rgba(255,255,255,0.42)"/>
          <rect x="15.5" y="16" width="5" height="14" rx="2" fill="rgba(255,255,255,0.70)"/>
          <rect x="24" y="8" width="5" height="22" rx="2" fill="white"/>
        </svg>
        <span class="brand-text"><span class="brand-smart">Smart</span><span class="brand-erp">ERP</span></span>
      </div>
      <div class="icon-wrap">
        <i class="fas fa-lock-open"></i>
      </div>
      <h2>Forgot password?</h2>
      <p>Enter your email address and we will send you a reset link.</p>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotForm" (ngSubmit)="submit()" novalidate class="modern-form">

      <!-- Email -->
      <div class="field-group">
        <div class="input-wrapper" [class.input-error]="f['email'].touched && f['email'].invalid">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" id="fp-email" formControlName="email" class="modern-input" placeholder=" " autocomplete="email">
          <label for="fp-email" class="floating-label">Address e-mail</label>
        </div>
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          <i class="fas fa-info-circle"></i> L'adresse e-mail est requise.
        </span>
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">
          <i class="fas fa-info-circle"></i> Veuillez entrer une adresse e-mail valide.
        </span>
      </div>

      <!-- Error / Success banners -->
      <div *ngIf="errorMessage" class="error-banner">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <div *ngIf="successMessage" class="success-banner">
        <i class="fas fa-check-circle"></i>
        <div>
          <span>{{ successMessage }}</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
        <span>{{ loading ? 'Envoi en cours...' : 'Envoyer le lien' }}</span>
        <i *ngIf="!loading" class="fas fa-paper-plane btn-arrow"></i>
      </button>

      <!-- Back to signin -->
      <div class="form-footer">
        <a routerLink="/auth/signin" class="back-link">
          <i class="fas fa-arrow-left"></i>
          Back to sign in
        </a>
      </div>
    </form>
  </div>
</div>
