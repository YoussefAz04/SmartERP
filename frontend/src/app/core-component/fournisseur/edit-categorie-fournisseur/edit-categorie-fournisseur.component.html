<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Edit Category Supplier</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a routerLink="/fournisseur/listCategorieFournisseur">Categorys</a></li>
        <li class="breadcrumb-item active">Edit</li>
      </ul>
    </div>
  </div>
</div>

<!-- Error State -->
<div class="alert alert-danger" *ngIf="errorMessage">
  <i class="feather icon-alert-circle me-2"></i>{{ errorMessage }}
</div>

<div class="row" *ngIf="!errorMessage">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <h5>Edit Category Supplier</h5>
        </div>
      </div>
      <div class="card-body">
        <!-- Loading State -->
        <div class="text-center py-3" *ngIf="isLoading && !categorieForm.dirty">
          <div class="spinner-border spinner-border-sm" role="status">
            <span class="visually-hidden">Chargement...</span>
          </div>
        </div>

        <form [formGroup]="categorieForm" (ngSubmit)="onSubmit()">
          <!-- Nom Field -->
          <div class="form-group mb-3">
            <label for="nom" class="form-label">Name <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              id="nom"
              formControlName="nom"
              placeholder="Entrez le nom de la catégorie"
              [class.is-invalid]="isFieldInvalid('nom')">
            <div class="invalid-feedback" *ngIf="isFieldInvalid('nom')">
              <span *ngIf="categorieForm.get('nom')?.errors?.['required']">Le nom est requis</span>
              <span *ngIf="categorieForm.get('nom')?.errors?.['minlength']">Le nom doit contenir au moins 2 characters</span>
            </div>
          </div>

          <!-- Description Field -->
          <div class="form-group mb-3">
            <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
            <textarea
              class="form-control"
              id="description"
              formControlName="description"
              rows="4"
              placeholder="Entrez la description de la catégorie"
              [class.is-invalid]="isFieldInvalid('description')"></textarea>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('description')">
              <span *ngIf="categorieForm.get('description')?.errors?.['required']">La description est requise</span>
              <span *ngIf="categorieForm.get('description')?.errors?.['minlength']">La description doit contenir au moins 5 characters</span>
            </div>
          </div>

          <!-- Buttons -->
          <div class="form-group d-flex gap-2">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="isLoading || categorieForm.invalid">
              <i class="feather icon-save"></i> Save
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              (click)="cancelForm()"
              [disabled]="isLoading">
              <i class="feather icon-x"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
