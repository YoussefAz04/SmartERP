<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Ajouter un Article Vente</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a routerLink="/article-vente/listArticleVente">Articles Vente</a></li>
        <li class="breadcrumb-item active">Ajouter</li>
      </ul>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter un Article Vente</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="articleForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="row">

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Nom <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="nom"
                  placeholder="Nom de l'article" [class.is-invalid]="isFieldInvalid('nom')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('nom')">
                  <span *ngIf="articleForm.get('nom')?.hasError('required')">Le nom est requis</span>
                  <span *ngIf="articleForm.get('nom')?.hasError('minlength')">Min 2 caractères</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Prix Unitaire <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="prixUnitaire"
                  placeholder="Prix de vente" [class.is-invalid]="isFieldInvalid('prixUnitaire')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('prixUnitaire')">
                  <span *ngIf="articleForm.get('prixUnitaire')?.hasError('required')">Le prix est requis</span>
                  <span *ngIf="articleForm.get('prixUnitaire')?.hasError('min')">Le prix doit être positif</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Quantité <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="quantite"
                  placeholder="Quantité" [class.is-invalid]="isFieldInvalid('quantite')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('quantite')">
                  <span *ngIf="articleForm.get('quantite')?.hasError('required')">La quantité est requise</span>
                  <span *ngIf="articleForm.get('quantite')?.hasError('min')">La quantité doit être positive</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Markup (%)</label>
                <input type="number" class="form-control" formControlName="markup"
                  placeholder="Pourcentage de marge" [class.is-invalid]="isFieldInvalid('markup')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('markup')">
                  <span *ngIf="articleForm.get('markup')?.hasError('min')">Le markup doit être positif</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Unité</label>
                <input type="text" class="form-control" formControlName="unite" placeholder="ex: pcs, kg, L">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">SKU / Référence</label>
                <input type="text" class="form-control" formControlName="sku" placeholder="Code SKU ou référence">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Article Achat (optionnel)</label>
                <select class="form-select" formControlName="articleAchatId">
                  <option value="">-- Lier à un article achat --</option>
                  <option *ngFor="let a of articlesAchat" [value]="a.id">{{ a.nom }}</option>
                </select>
              </div>
            </div>

            <div class="col-lg-12">
              <div class="input-blocks mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" formControlName="description" rows="3"
                  placeholder="Description de l'article"></textarea>
              </div>
            </div>

          </div>

          <div class="d-flex justify-content-end mt-4 gap-2">
            <button type="button" class="btn btn-cancel" [disabled]="isLoading" (click)="onCancel()">
              <i class="feather icon-x me-2"></i>Annuler
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="isLoading">
              <i class="feather icon-check me-2"></i>{{ isLoading ? 'En cours...' : 'Soumettre' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
