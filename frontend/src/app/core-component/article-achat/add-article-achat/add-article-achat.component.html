<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Ajouter un Article Achat</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a routerLink="/article-achat/listArticleAchat">Articles Achat</a></li>
        <li class="breadcrumb-item active">Ajouter</li>
      </ul>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter un Article Achat</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="articleForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="row">

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Entreprise <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="entrepriseId"
                  [class.is-invalid]="isFieldInvalid('entrepriseId')">
                  <option value="">-- Sélectionnez une entreprise --</option>
                  <option *ngFor="let e of entreprises" [value]="e.id">{{ e.nom }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="isFieldInvalid('entrepriseId')">
                  L'entreprise est requise
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Référence <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="reference"
                  placeholder="Référence unique de l'article" [class.is-invalid]="isFieldInvalid('reference')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('reference')">
                  <span *ngIf="articleForm.get('reference')?.hasError('required')">La référence est requise</span>
                  <span *ngIf="articleForm.get('reference')?.hasError('minlength')">Min 2 caractères</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Nom <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="nom"
                  placeholder="Nom de l'article" [class.is-invalid]="isFieldInvalid('nom')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('nom')">
                  <span *ngIf="articleForm.get('nom')?.hasError('required')">Le nom est requis</span>
                  <span *ngIf="articleForm.get('nom')?.hasError('minlength')">Min 2 caractères</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Prix d'Achat <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="prixUnitaire"
                  placeholder="Prix d'achat" [class.is-invalid]="isFieldInvalid('prixUnitaire')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('prixUnitaire')">
                  <span *ngIf="articleForm.get('prixUnitaire')?.hasError('required')">Le prix est requis</span>
                  <span *ngIf="articleForm.get('prixUnitaire')?.hasError('min')">Le prix doit être positif</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Prix de Vente <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="prixVente"
                  placeholder="Prix de vente" [class.is-invalid]="isFieldInvalid('prixVente')">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('prixVente')">
                  <span *ngIf="articleForm.get('prixVente')?.hasError('required')">Le prix de vente est requis</span>
                  <span *ngIf="articleForm.get('prixVente')?.hasError('min')">Le prix doit être positif</span>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Catégorie</label>
                <select class="form-select" formControlName="categorieArticleId">
                  <option value="">-- Sélectionnez une catégorie --</option>
                  <option *ngFor="let c of categories" [value]="c.id">{{ c.libelle || c.code }}</option>
                </select>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks mb-3">
                <label class="form-label">Unité de Mesure</label>
                <select class="form-select" formControlName="mesureId">
                  <option value="">-- Sélectionnez une unité --</option>
                  <option *ngFor="let m of mesures" [value]="m.id">{{ m.libelle || m.code }}</option>
                </select>
              </div>
            </div>

            <div class="col-lg-12">
              <div class="input-blocks mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" formControlName="description" rows="3"
                  placeholder="Description de l'article"></textarea>
              </div>
            </div>

          </div>

          <div class="d-flex justify-content-end mt-4 gap-2">
            <button type="button" class="btn btn-cancel" [disabled]="isLoading" (click)="onCancel()">
              <i class="feather icon-x me-2"></i>Annuler
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="isLoading">
              <i class="feather icon-check me-2"></i>{{ isLoading ? 'En cours...' : 'Soumettre' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
