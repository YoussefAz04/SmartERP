<div class="container mt-4">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Add une Invoice de Vente</h5>
    </div>

    <div class="card-body">
      <form [formGroup]="factureForm" (ngSubmit)="onSubmit()">

        <!-- Infos facture -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Purchase date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" formControlName="dateAchat">
            <div *ngIf="factureForm.get('dateAchat')?.invalid && factureForm.get('dateAchat')?.touched" class="text-danger">
              La date d'achat est obligatoire
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label>Reference <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="referance">
            <div *ngIf="factureForm.get('referance')?.invalid && factureForm.get('referance')?.touched" class="text-danger">
              La reference est obligatoire
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Remise (%)</label>
            <input type="number" class="form-control" formControlName="remise" (input)="updateTotal()">
          </div>
          <div class="col-md-4 mb-3">
            <label>Mode de Paiement</label>
            <input type="text" class="form-control" formControlName="modePaiement">
          </div>
          <div class="col-md-4 mb-3">
            <label>Status</label>
            <input type="text" class="form-control" formControlName="statut">
          </div>
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea class="form-control" formControlName="description"></textarea>
        </div>

        <!-- Détail facture -->
        <h6 class="mt-3">Invoice Detail</h6>
        <div formGroupName="detaisFactureDeVente" class="row">
          <div class="col-md-3 mb-3">
            <label>Product <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="article">
            <div *ngIf="factureForm.get('detaisFactureDeVente.article')?.invalid && factureForm.get('detaisFactureDeVente.article')?.touched" class="text-danger">
              Product obligatoire
            </div>
          </div>

          <div class="col-md-2 mb-3">
            <label>Quantity</label>
            <input type="number" class="form-control" formControlName="quantite" (input)="updateTotal()">
          </div>

          <div class="col-md-2 mb-3">
            <label>Prix HT</label>
            <input type="number" class="form-control" formControlName="prixUnitaireHT" (input)="updateTotal()">
          </div>

          <div class="col-md-2 mb-3">
            <label>TVA (%)</label>
            <input type="number" class="form-control" formControlName="tva" (input)="updateTotal()">
          </div>

          <div class="col-md-3 mb-3">
            <label>Total TTC</label>
            <input type="number" class="form-control" formControlName="totalTTC" >
          </div>
        </div>

        <!-- Totaux globaux -->
        <h6 class="mt-3">Summary</h6>
        <div class="row">
          <div class="col-md-3 mb-3">
            <label>Amount excl. tax</label>
            <input type="number" class="form-control" formControlName="montantHT" >
          </div>
          <div class="col-md-3 mb-3">
            <label>VAT amount</label>
            <input type="number" class="form-control" formControlName="montantTVA" >
          </div>
          <div class="col-md-3 mb-3">
            <label>Amount incl. tax</label>
            <input type="number" class="form-control" formControlName="montantTTC" >
          </div>
          <div class="col-md-3 mb-3">
            <label>Total (discount applied)</label>
            <input type="number" class="form-control" formControlName="montantTotal" >
          </div>
        </div>

        <!-- Bouton submit -->
        <button type="submit" class="btn btn-primary" [disabled]="factureForm.invalid">
          <i class="bi bi-save"></i> Save
        </button>
      </form>
    </div>
  </div>
</div>
