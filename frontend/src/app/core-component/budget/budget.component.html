<!-- Page Header -->
<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>Liste des Budgets</h4>
      <h6>Gestion des budgets par projet</h6>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a matTooltip="Pdf" matTooltipPosition="above"><img src="assets/img/icons/pdf.svg" alt="pdf"></a>
    </li>
    <li>
      <a matTooltip="Excel" matTooltipPosition="above"><img src="assets/img/icons/excel.svg" alt="excel"></a>
    </li>
    <li>
      <a matTooltip="Imprimer" matTooltipPosition="above"><i class="feather icon-printer feather-rotate-ccw"></i></a>
    </li>
    <li>
      <a matTooltip="Rafraîchir" matTooltipPosition="above" (click)="loadBudgets()">
        <i class="feather icon-rotate-ccw feather-rotate-ccw"></i>
      </a>
    </li>
  </ul>
  <div class="page-btn">
    <a (click)="addBudget()"   *ngIf="permissionBudget.create" class="btn btn-added" data-bs-toggle="modal" data-bs-target="#add-budget">
      <i class="feather icon-plus-circle me-2"></i>Ajouter Budget
    </a>
  </div>
</div>
<!-- /Page Header -->

<!-- Table responsive -->
<div class="row">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-header justify-content-between">
        <div class="card-title">
          Liste des Budgets
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table text-nowrap">
            <thead>
            <tr>
              <th>Nom</th>
              <th>Montant</th>
              <th>Date Début</th>
              <th>Date Fin</th>
              <th>Projet</th>
              <th >Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let b of budgets">
              <td>{{ b.nom }}</td>
              <td>{{ b.montant | number:'1.0-2' }} DT</td>
              <td>{{ b.dateDebut }}</td>
              <td>{{ b.dateFin }}</td>
              <td>{{ getProjetById(b.idProjet) }}</td>
              <td class="action-table-data text-center">
                <div class="edit-delete-action">
                  <a class="me-2 p-2 mb-0"  (click)="router.navigate(['/budget/detaisBudget',b.id])" *ngIf="permissionBudget.view">
                    <i class="feather icon-eye action-eye"></i>
                  </a>
                  <a class="confirm-text p-2 mb-0" (click)="deleteBudget(b.id)" *ngIf="permissionBudget.delete">
                    <i class="feather icon-trash-2 feather-trash-2"></i>
                  </a>
                </div>
              </td>
            </tr>
            </tbody>
          </table>

          <!-- Aucun budget -->
          <div *ngIf="!loading && budgets.length === 0" class="text-center p-3">
            Aucun budget trouvé.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /Table responsive -->
