<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Modifier Dépense</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink]="['/dashboard']">Dashboard</a></li>
        <li class="breadcrumb-item active">Modifier Dépense</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Détails de la Dépense</h5>
      </div>
      <div class="card-body">
        <form *ngIf="depense" (ngSubmit)="onSubmit()">

          <div class="row">
            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Description</label>
                <input type="text" class="form-control" [(ngModel)]="depense.description" name="description">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Montant</label>
                <input type="number" class="form-control" [(ngModel)]="depense.montant" name="montant">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Date Dépense</label>
                <input type="date" class="form-control" [(ngModel)]="depense.dateDepense" name="dateDepense">
              </div>
            </div>




          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-cancel me-2" (click)="router.navigate(['/budget/listDepense'])">
              Annuler
            </button>
            <button type="submit" class="btn btn-submit"   *ngIf="permissionDepense.update" >
              Enregistrer
            </button>
          </div>
        </form>

        <div *ngIf="!depense" class="text-center p-3">
          Chargement de la dépense...
        </div>

      </div>
    </div>
  </div>
</div>
