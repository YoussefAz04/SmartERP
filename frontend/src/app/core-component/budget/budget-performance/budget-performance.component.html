<div class="container mt-4">
  <h2 class="mb-3">📊 Performance des Budgets</h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Tableau -->
  <table class="table table-bordered table-striped" *ngIf="!loading && performances.length > 0">
    <thead class="table-dark">
    <tr>
      <th>Nom Budget</th>
      <th>Taux Consommation (%)</th>
      <th>Taux Temps (%)</th>
      <th>En dépassement ?</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let p of performances" [ngClass]="{'table-danger': p.depassement}">
      <td><strong>{{ p.nom }}</strong></td>
      <td>{{ p.tauxConsommation | number:'1.0-2' }}%</td>
      <td>{{ p.tauxTemps | number:'1.0-2' }}%</td>
      <td>
              <span class="badge" [ngClass]="getStatusBadgeClass(p.depassement)">
                {{ getStatusText(p.depassement) }}
              </span>
      </td>
    </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && performances.length === 0" class="alert alert-warning">
    <i class="fas fa-exclamation-triangle"></i>
    Aucun budget trouvé.
  </div>

  <!-- Graphique -->
  <div *ngIf="!loading && performances.length > 0" class="mt-4">
    <h4>📈 Taux de consommation par budget</h4>
    <div class="chart-container" style="position: relative; height: 400px;">
      <canvas #chartCanvas></canvas>
    </div>
  </div>
</div>
