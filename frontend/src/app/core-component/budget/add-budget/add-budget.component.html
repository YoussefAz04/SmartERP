<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Formulaire Budget</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink]="routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Ajouter Budget</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter un Budget</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="budgetForm" (ngSubmit)="onSubmit()">
          <div class="row">

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Nom</label>
                <input type="text" class="form-control" formControlName="nom">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Montant</label>
                <input type="number" class="form-control" formControlName="montant">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Date Début</label>
                <input type="date" class="form-control" formControlName="dateDebut">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Date Fin</label>
                <input type="date" class="form-control" formControlName="dateFin">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>ID Projet</label>
                <select class="form-select" formControlName="idProjet">
                  <option *ngFor="let projet of projets" [value]="projet.id">
                    {{ projet.id }} - {{ projet.nom }}
                  </option>
                </select>
              </div>
            </div>


          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-cancel me-2">Annuler</button>
            <button type="submit" class="btn btn-submit" [disabled]="budgetForm.invalid">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
