<div class="container mt-4">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"> Modifier une Tâche</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #tacheForm="ngForm">

        <!-- Titre -->
        <div class="mb-3">
          <label for="titre" class="form-label">Titre</label>
          <input type="text" id="titre" class="form-control" name="titre"
                 [(ngModel)]="tache.titre" required>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" class="form-control" name="description"
                    [(ngModel)]="tache.description" rows="3"></textarea>
        </div>

        <!-- Date début -->
        <div class="mb-3">
          <label for="dateDebut" class="form-label">Date de début</label>
          <input type="date" id="dateDebut" class="form-control" name="dateDebut"
                 [(ngModel)]="tache.dateDebut" required>
        </div>

        <!-- Date fin -->
        <div class="mb-3">
          <label for="dateFin" class="form-label">Date de fin</label>
          <input type="date" id="dateFin" class="form-control" name="dateFin"
                 [(ngModel)]="tache.dateFin" required>
        </div>

        <!-- Statut -->
        <div class="mb-3">
          <label for="statut" class="form-label">Statut</label>
          <select id="statut" class="form-select" name="statut"
                  [(ngModel)]="tache.statut" required>
            <option [ngValue]="StatutTache.A_FAIRE">À faire</option>
            <option [ngValue]="StatutTache.EN_COURS">En cours</option>
            <option [ngValue]="StatutTache.TERMINEE">Terminée</option>
            <option [ngValue]="StatutTache.BLOQUEE">Bloquée</option>
          </select>
        </div>

        <!-- Priorité -->
        <div class="mb-3">
          <label for="priorite" class="form-label">Priorité</label>
          <select id="priorite" class="form-select" name="priorite"
                  [(ngModel)]="tache.priorite" required>
            <option [ngValue]="PrioriteDeTache.FAIBLE">Faible</option>
            <option [ngValue]="PrioriteDeTache.MOYENNE">Moyenne</option>
            <option [ngValue]="PrioriteDeTache.ELEVEE">Élevée</option>
            <option [ngValue]="PrioriteDeTache.URGENTE">Urgente</option>
          </select>
        </div>

        <!-- Durée -->
        <div class="mb-3">
          <label for="duree" class="form-label">Durée (en heures)</label>
          <input type="number" id="duree" class="form-control" name="duree"
                 [(ngModel)]="tache.duree" required>
        </div>

        <!-- Progression -->
        <div class="mb-3">
          <label for="progres" class="form-label">Progression (%)</label>
          <input type="number" id="progres" class="form-control" name="progres"
                 [(ngModel)]="tache.progres" min="0" max="100" required>
        </div>

        <!-- Prédécesseur -->
        <div class="mb-3">
          <label for="predecesseur" class="form-label">Prédécesseur</label>
          <input type="text" id="predecesseur" class="form-control" name="predecesseur"
                 [(ngModel)]="tache.predecesseur">
        </div>

        <!-- Bouton submit -->
        <button type="submit" class="btn btn-primary"
                [disabled]="!tacheForm.form.valid">
          Enregistrer
        </button>
      </form>
    </div>
  </div>
</div>
