<h2 mat-dialog-title>Assigner Rôle</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Sélectionnez un rôle</mat-label>
    <mat-select [(ngModel)]="selectedRoleId" name="roleId">
      <mat-option *ngFor="let role of roles" [value]="role.id">
        {{ role.name }}{{ role.roleType ? ' (' + role.roleType + ')' : '' }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="assignRole()" [disabled]="!selectedRoleId">
    Assigner Rôle
  </button>
</mat-dialog-actions>
