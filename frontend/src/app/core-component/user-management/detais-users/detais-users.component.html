<div class="page-header">
  <div class="page-title">
    <h4>Détails Utilisateur</h4>
    <h6>Modifier les informations de l'utilisateur</h6>
  </div>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h5>Informations Utilisateur</h5>
      </div>
      <div class="card-body">
        @if (isLoading) {
          <div class="text-center">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Chargement...</span>
            </div>
          </div>
        } @else if (user) {
          <form (ngSubmit)="onSubmit()" #userForm="ngForm">
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Nom d'utilisateur</label>
              <input type="text" id="username" class="form-control" name="username" [(ngModel)]="user!.username" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" name="email" [(ngModel)]="user!.email" required>
            </div>

            <!-- Enabled Status -->
            <div class="mb-3">
              <label for="enabled" class="form-label">Statut</label>
              <select id="enabled" class="form-select" name="enabled" [(ngModel)]="user!.enabled" required>
                <option [ngValue]="true">Actif</option>
                <option [ngValue]="false">Inactif</option>
              </select>
            </div>

            <!-- Roles -->
            <div class="mb-3">
              <label for="roles" class="form-label">Rôles</label>
              <input type="text" id="roles" class="form-control" name="roles"
                     [(ngModel)]="user!.roles" placeholder="Ex : ROLE_ADMIN, ROLE_USER">
            </div>

            <!-- Entreprise -->
            <div class="mb-3">
              <label for="entrepriseNom" class="form-label">Entreprise</label>
              <input type="text" id="entrepriseNom" class="form-control" name="entrepriseNom"
                     [(ngModel)]="user!.entrepriseNom" min="1" required>
            </div>

            <!-- Buttons -->
            <div class="form-group d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="isSubmitting" *ngIf="permissionUsers?.update">
                <i class="feather icon-save"></i> Enregistrer
              </button>
              <button type="button" class="btn btn-secondary" (click)="goBack()" [disabled]="isSubmitting">
                <i class="feather icon-x"></i> Annuler
              </button>
            </div>
          </form>
        } @else {
          <div class="alert alert-danger">Utilisateur non trouvé</div>
        }
      </div>
    </div>
  </div>
</div>
