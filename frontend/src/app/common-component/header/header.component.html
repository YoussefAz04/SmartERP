<!-- header.component.html -->
<div class="header-modern-wrapper">
  <header class="header-modern">
    
   <!-- LEFT: Logo Section -->
<div class="header-section header-logo-section">
  <a [routerLink]="routes.adminDashboard" class="logo-brand">
    <div class="logo-wrapper">
      <img src="assets/img/logo.png" alt="Dreams POS" class="logo-img">
      <span class="logo-text">Dreams</span>
      <span class="logo-badge">POS</span>
    </div>
  </a>
</div>

    <!-- CENTER: Search Bar -->
    <div class="header-section header-search-section">
      <div class="search-wrapper">
        <i class="feather icon-search"></i>
        <input 
          type="text" 
          class="search-input"
          placeholder="Search clients, articles, commands..."
          [(ngModel)]="searchQuery"
          (input)="onSearchInput(searchQuery)"
          (blur)="onSearchBlur()"
          autocomplete="off">
        <button class="search-clear" *ngIf="searchQuery" (click)="clearSearch()" type="button">
          <i class="feather icon-x-circle"></i>
        </button>
        <div class="search-spinner" *ngIf="isSearching">
          <i class="feather icon-loader"></i>
        </div>

        <!-- Search Dropdown -->
        <div class="search-dropdown" *ngIf="showSearchDropdown">
          <div class="dropdown-empty" *ngIf="searchResults.length === 0 && !isSearching">
            <i class="feather icon-inbox"></i>
            <p>No results found</p>
          </div>
          <div class="dropdown-results" *ngIf="searchResults.length > 0">
            <ul class="results-list">
              <li *ngFor="let result of searchResults" class="result-item">
                <a href="javascript:void(0);">
                  <span class="result-badge" [ngClass]="'badge-' + result.type.toLowerCase()">
                    {{ result.type }}
                  </span>
                  <span class="result-text">{{ result.nom }}</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Actions & Profile -->
    <div class="header-section header-action-section">
      
      <!-- Theme Toggle -->
      <button class="icon-btn" [title]="lightMode ? 'Dark mode' : 'Light mode'" type="button"
        (click)="changeThemeMode(lightMode ? 'dark_mode' : 'light_mode')">
        <i class="feather" [ngClass]="lightMode ? 'icon-moon' : 'icon-sun'"></i>
      </button>

      <!-- Fullscreen -->
      <button class="icon-btn" title="Fullscreen" type="button" (click)="fullscreen()">
        <i class="feather icon-maximize-2"></i>
      </button>

      <!-- Settings -->
      <a [routerLink]="routes.generalSettings" class="icon-btn" title="Settings">
        <i class="feather icon-settings"></i>
      </a>

      <!-- Notifications -->
      <div class="dropdown-wrapper notifications-wrapper">
        <button class="icon-btn notification-btn" 
          (click)="toggleNotifications()"
          [class.has-badge]="unreadCount > 0"
          type="button"
          title="Notifications">
          <i class="feather icon-bell"></i>
          <span class="badge-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <!-- Notifications Dropdown -->
        <div class="dropdown-panel notifications-dropdown" *ngIf="showNotifications">
          <div class="dropdown-header">
            <h6 class="dropdown-title">Notifications</h6>
            <button class="mark-read-btn" (click)="markAllRead()" type="button">Mark all</button>
          </div>
          
          <div class="dropdown-content">
            <div class="loading-state" *ngIf="isLoadingNotifications">
              <i class="feather icon-loader"></i>
            </div>
            
            <ul class="notifications-list" *ngIf="!isLoadingNotifications">
              <li *ngFor="let notif of notifications" 
                class="notification-item"
                [class.unread]="!notif.lu"
                (click)="markRead(notif.id)">
                <div class="notif-icon">
                  <i class="feather icon-bell"></i>
                </div>
                <div class="notif-content">
                  <p class="notif-message">{{ notif.message }}</p>
                  <span class="notif-time">{{ notif.date | date:'dd/MM HH:mm' }}</span>
                </div>
                <span class="unread-indicator" *ngIf="!notif.lu"></span>
              </li>
              <li *ngIf="notifications.length === 0" class="empty-state">
                <p>No notifications</p>
              </li>
            </ul>
          </div>

          <div class="dropdown-footer">
            <a [routerLink]="routes.activities" class="view-all-link">
              View all <i class="feather icon-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- User Profile -->
      <div class="dropdown-wrapper profile-wrapper">
        <button class="user-profile-btn" (click)="toggleProfile()" type="button">
          <span class="user-avatar">
            <span class="avatar-init" *ngIf="userInitials">{{ userInitials }}</span>
            <img src="assets/img/profiles/avator1.jpg" *ngIf="!userInitials" alt="Avatar">
          </span>
          <span class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ roleName?.[0] || 'User' }}</span>
          </span>
          <i class="feather icon-chevron-down"></i>
        </button>

        <!-- Profile Dropdown -->
        <div class="dropdown-panel profile-dropdown" *ngIf="showProfile">
          <div class="profile-header">
            <div class="profile-avatar-large">
              <span class="avatar-init-large" *ngIf="userInitials">{{ userInitials }}</span>
              <img src="assets/img/profiles/avator1.jpg" *ngIf="!userInitials" alt="Avatar">
              <span class="online-badge"></span>
            </div>
            <div class="profile-details">
              <h6 class="profile-name">{{ userName }}</h6>
              <p class="profile-role">{{ roleName?.[0] || 'User' }}</p>
              <p class="profile-org" *ngIf="entrepriseName">
                <i class="feather icon-briefcase"></i> {{ entrepriseName }}
              </p>
            </div>
          </div>

          <div class="profile-menu">
            <a [routerLink]="routes.profile" class="profile-menu-item">
              <i class="feather icon-user"></i>
              <span>My Profile</span>
            </a>
            <a [routerLink]="routes.generalSettings" class="profile-menu-item">
              <i class="feather icon-settings"></i>
              <span>Settings</span>
            </a>
            <div class="menu-divider"></div>
            <button class="profile-menu-item logout" (click)="logout()" type="button">
              <i class="feather icon-log-out"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
</div>
